<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Case File — The Interrogation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07080b;--ink:#e8e4da;--amb:#e0a84a;--red:#d1432f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",ui-monospace,monospace;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:11px;letter-spacing:.15em;color:var(--amb)}
button{font:inherit;cursor:pointer;color:var(--ink);background:#1a1d24;border:1px solid #3a3f4a;border-radius:4px;padding:8px 12px}
button:disabled{opacity:.4}
#frame{position:relative;width:min(100%,calc((100dvh - 290px)*1.6667));aspect-ratio:5/3;margin:0 auto;overflow:hidden;background:#000;flex:none}
#room{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.8s cubic-bezier(.4,0,.2,1)}
#room.ots{transform:scale(1.3);transform-origin:35% 70%}#room.cs{transform:scale(2.7);transform-origin:62% 38%}#room.cd{transform:scale(2);transform-origin:18% 62%}#room.slow{transition-duration:6s}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 60% 40%,transparent 35%,#000c 100%)}
#flash{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .5s;pointer-events:none}
.say{position:absolute;opacity:0;transform:translateY(12px);transition:opacity .8s,transform 1.2s;font-size:clamp(10px,2.6vw,17px);line-height:1.3;pointer-events:none;text-shadow:0 1px 6px #000}
.say.show{opacity:1;transform:translateY(-4px)}.say.out{opacity:0;transform:translateY(-26px)}
.say b{display:block;font-size:.7em;letter-spacing:.25em;margin-bottom:2px}.say .t{display:block;animation:flo 3s ease-in-out infinite}
@keyframes flo{50%{transform:translateY(-3px)}}
#msay{left:50%;top:5%;width:48%;color:#fff}#msay b{color:#ff8d7a}
#dsay{left:3%;bottom:5%;width:46%;color:#f4d58d;font-style:italic}#dsay b{color:var(--amb);font-style:normal}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:bold;font-size:clamp(14px,4.5vw,28px);opacity:0;pointer-events:none;text-shadow:0 0 12px currentColor}
#banner.go{animation:bn 2.4s forwards}#banner.clue{color:var(--amb)}#banner.contra{color:var(--red)}
@keyframes bn{0%{opacity:0;transform:scale(1.8);letter-spacing:.8em}12%{opacity:1;transform:scale(1);letter-spacing:.3em}20%{transform:translateX(4px) skewX(8deg)}26%{transform:none}85%{opacity:1}100%{opacity:0}}
.paper{background:#e9e2c8;color:#222;padding:10px 14px;border-radius:3px;box-shadow:0 8px 30px #000;font-size:clamp(10px,2.6vw,15px);text-align:left}
.paper .nev{color:#b3261e;font-weight:bold;letter-spacing:.25em;animation:fl .5s 4}.paper .ttl{font-weight:bold;margin:4px 0}.paper .ico{font-size:2em}.paper p{margin:4px 0 0}
@keyframes fl{50%{opacity:.2}}
#ecard{position:absolute;left:50%;top:52%;width:62%;transform:translate(160%,-50%) rotate(14deg);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.3,1),opacity .6s}
#ecard.in{transform:translate(-50%,-50%) rotate(-3deg);opacity:1}#ecard.out{transform:translate(-50%,170%) rotate(7deg);opacity:0}
#log{flex:1;min-height:0;overflow:auto;padding:6px 14px;font-size:12px;color:#9aa0ab}#log p{margin:3px 0}#log .m{color:#ffb0a2}#log .d{color:#e6c987}
#evbar{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;align-items:center;min-height:42px;font-size:11px;color:#6d7380}
#evbar button{white-space:nowrap}
#inp{display:flex;gap:8px;padding:8px 12px 12px}#inp input{flex:1;font:inherit;font-size:16px;color:var(--ink);background:#10131a;border:1px solid #3a3f4a;border-radius:4px;padding:10px;min-width:0}
#inp input::placeholder{letter-spacing:.15em;color:#6d7380}
#intro,#menu,#modal{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px}
#intro .l{font-size:clamp(18px,6vw,40px);letter-spacing:.2em;min-height:1.3em}
.gl{animation:gl .35s steps(2) 6}@keyframes gl{0%{text-shadow:3px 0 #f0f,-3px 0 #0ff;transform:translateX(3px)}50%{text-shadow:-4px 0 #f0f,4px 0 #0ff;transform:translateX(-4px) skewX(-6deg)}100%{text-shadow:none;transform:none}}
#menu h1{letter-spacing:.3em;margin:0;color:var(--amb);font-size:clamp(20px,6vw,36px)}#menu p{max-width:34ch;color:#9aa0ab;font-size:13px;margin:0}
#modal{background:#000b;z-index:30}#modal .paper{max-width:340px}
#mira,#mira *{transform-box:view-box}
#mbody{transform-origin:250px 175px;animation:br 4s ease-in-out infinite}@keyframes br{50%{transform:scaleY(1.022)}}
#dbody{transform-origin:70px 240px;animation:br 4.5s ease-in-out infinite}
#mhead{transform-origin:250px 120px;transition:transform .8s}#pup{transition:transform .6s;transform:translateX(-3px)}
#bl{transform-origin:241px 84px}#br{transform-origin:259px 84px}#bl,#br{transition:transform .5s}
#mouth{transform-origin:250px 105px}.talk #mouth{animation:tk .22s infinite alternate}@keyframes tk{to{transform:scaleY(2.2)}}
#mira.nervous #mhead{animation:hd 3.2s ease-in-out infinite}@keyframes hd{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translateX(3px)}}
#mira.nervous #pup{animation:gz 2.6s steps(1) infinite}@keyframes gz{0%{transform:translateX(-3px)}40%{transform:translate(3px,2px)}70%{transform:translate(-2px,3px)}}
#mira.nervous #mh,#mira.panicked #mh{animation:fd .45s infinite alternate}@keyframes fd{to{transform:translate(4px,-2px)}}
#mira.nervous #mbody{animation:sf 3s infinite}@keyframes sf{50%{transform:translateX(5px)}}
#mira.panicked #mbody{animation:br .7s infinite}#mira.panicked #mhead{animation:sh .15s infinite alternate}@keyframes sh{to{transform:translate(1.5px,1px) rotate(3deg)}}
#mira.panicked #pup{transform:translate(4px,3px)}#mira.panicked #bl{transform:rotate(-14deg)}#mira.panicked #br{transform:rotate(14deg)}
#mira.angry #mhead{transform:translateY(4px) scale(1.04)}#mira.angry #bl{transform:rotate(18deg)}#mira.angry #br{transform:rotate(-18deg)}
#mira.scared #mhead{transform:translateY(-3px) rotate(-3deg)}#mira.scared #bl{transform:rotate(-14deg) translateY(-2px)}#mira.scared #br{transform:rotate(14deg) translateY(-2px)}#mira.scared #pup{transform:translate(4px,0)}
#mira.down #mhead,#mira.evid #mhead{transform:rotate(14deg) translateY(6px)}#mira.down #pup,#mira.evid #pup{transform:translate(-2px,4px)}
#mira.down #mh,#mira.down #mbody{animation:none}
#pup.gl{transform:translate(4px,-2px)!important}
#dhand{animation:wr .5s infinite alternate}@keyframes wr{to{transform:translate(4px,1px)}}
#det{transition:transform .6s}#det.lean{transform:translate(16px,-6px) scale(1.03)}
#mbox{width:min(92vw,380px);max-height:84dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}#mbox .hd{color:var(--amb);letter-spacing:.3em;text-align:center}#mbox small{color:#9aa0ab}#mbox .paper button{margin-top:8px;color:#222;background:#cfc6a6;border-color:#8a8466}
#fin{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center}.pol{text-align:center}
.phone{width:min(70vw,260px);background:#111722;border:2px solid #39455a;border-radius:18px;padding:22px;box-shadow:0 0 40px #5b8defaa;animation:glow 1.2s infinite alternate;text-align:left}.phone small{display:block;color:#8aa0c0;letter-spacing:.2em;margin-bottom:8px}.phone b{font-size:22px;color:#d6e6ff}
@keyframes glow{to{box-shadow:0 0 80px #8ab8ffdd}}
#mira.defensive #bl{transform:rotate(9deg)}#mira.defensive #br{transform:rotate(-9deg)}#mira.defensive #mhead{transform:rotate(-3deg)}#mira.defensive #mh{transform:translateX(6px)}
#mira.broken #mhead{transform:rotate(12deg) translateY(6px);animation:sh .3s infinite alternate}#mira.broken #pup{transform:translate(-2px,4px)}
.rd{stroke:#9fc3e8;stroke-width:.8;opacity:.7;animation:rn .7s linear infinite}@keyframes rn{from{transform:translateY(0)}to{transform:translateY(95px)}}
#lampR{animation:fk 7s infinite}@keyframes fk{0%,41%,46%,100%{opacity:1}42%{opacity:.35}43%{opacity:.9}44%{opacity:.2}}
#cm{transform-origin:180px 42px;animation:spin 60s steps(60) infinite}#ch{transform-origin:180px 42px;animation:spin 3600s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fg{animation:gl .35s steps(2) 1}

#fx,#grain,#scan,#bolt,#pulse{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#grain{opacity:.1;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:gr .6s steps(6) infinite}
@keyframes gr{20%{background-position:-40px 30px}40%{background-position:60px -50px}60%{background-position:-70px -20px}80%{background-position:30px 70px}}
#scan{background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px);overflow:hidden}
#scan::after{content:'';position:absolute;left:0;right:0;height:18%;top:-20%;background:linear-gradient(#0000,#9fc3e822,#0000);animation:sc 7s linear infinite}@keyframes sc{to{top:110%}}
#bolt{background:#cfe3ff;mix-blend-mode:screen;opacity:0}#bolt.go{animation:bo 1.1s}@keyframes bo{0%{opacity:0}5%{opacity:.85}12%{opacity:.1}20%{opacity:.6}100%{opacity:0}}
#pulse{opacity:0}#frame[data-s="2"] #pulse,#frame[data-s="3"] #pulse,#frame[data-s="4"] #pulse{opacity:1;animation:pl 1.6s infinite}#frame[data-s="3"] #pulse,#frame[data-s="4"] #pulse{animation-duration:.8s}
@keyframes pl{0%,100%{box-shadow:inset 0 0 40px #d1432f00}15%{box-shadow:inset 0 0 90px #d1432f88}}
#lbt,#lbb{position:absolute;left:0;right:0;height:0;background:#000;transition:height 1s;pointer-events:none}#lbt{top:0}#lbb{bottom:0}#frame.cine #lbt,#frame.cine #lbb{height:9%}
#rec{position:absolute;left:3%;top:3%;font-size:clamp(8px,2vw,12px);color:#ff6a5a;letter-spacing:.15em;text-shadow:0 0 6px #000;pointer-events:none}#rec i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#e33;margin-right:.4em;animation:fl 1s steps(1) infinite}
#vit{position:absolute;right:2%;bottom:4%;width:25%;font-size:clamp(7px,1.8vw,10px);color:#7dffa8;letter-spacing:.1em;background:#000a;padding:3px 5px;border:1px solid #2a6;pointer-events:none;transition:color .6s,border-color .6s}
#vit canvas{width:100%;height:24px;display:block}#vit .r{display:flex;justify-content:space-between}#frame[data-s="3"] #vit,#frame[data-s="4"] #vit{color:#ff6a5a;border-color:#a33}#frame[data-s="2"] #vit{color:var(--amb);border-color:#a82}
#frame.shake{animation:shk .6s,gl .35s steps(2) 1}@keyframes shk{10%{transform:translate(-6px,3px)}30%{transform:translate(7px,-4px)}50%{transform:translate(-5px,-3px)}70%{transform:translate(4px,4px)}90%{transform:translate(-2px,1px)}}
#ecard.in::after{content:'LOGGED';position:absolute;right:10px;bottom:8px;border:2px solid #b3261e;color:#b3261e;padding:1px 8px;font-weight:bold;letter-spacing:.2em;animation:stp .35s .9s both}@keyframes stp{from{opacity:0;transform:scale(3.2) rotate(-4deg)}to{opacity:.85;transform:scale(1) rotate(-12deg)}}
.lid{fill:#c99a82}#mira .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:bk 4.2s infinite}@keyframes bk{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
#sweat{opacity:0}#mira.nervous #sweat,#mira.panicked #sweat,#mira.broken #sweat,#mira.scared #sweat{animation:dr 1.6s infinite}@keyframes dr{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(26px);opacity:0}}
.stm{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:1.4;stroke-linecap:round;animation:sm 3s ease-out infinite}@keyframes sm{from{transform:translateY(0);opacity:1}to{transform:translateY(-16px);opacity:0}}
#lampR{transform-box:view-box;transform-origin:248px 0;animation:fk 7s infinite,sw 5s ease-in-out infinite}@keyframes sw{50%{transform:rotate(1.6deg)}}

#room.two{transform:scale(1.15);transform-origin:45% 55%}#room.evc{transform:scale(3);transform-origin:43% 88%}#room.bd{transform:scale(2.6);transform-origin:86% 26%}#room.sots{transform:scale(1.5);transform-origin:82% 62%}#room.cut{transition-duration:.12s}
#det.back{transform:translate(-16px,4px) scale(.98)}#det.stand{transform:translateY(-34px) scale(1.04)}#det.walk{animation:wk 3s ease-in-out}@keyframes wk{35%,70%{transform:translate(150px,-26px) scale(1.04)}}
#dhand{transition:transform .4s}#det.point #dhand{animation:none;transform:translate(36px,-14px)}#det.write #dhand{animation:wr .1s infinite alternate}
#mira.cross #mh{animation:none;transform:translateY(-16px) scale(.8)}#mira.cover #mh{animation:none;transform:translateY(-70px) scale(1.3)}#mira.slam #mh{animation:sl .5s 2}@keyframes sl{40%{transform:translateY(-30px)}60%{transform:translateY(6px)}}#mira.slam #mbody{animation:none;transform:scale(1.04)}
#mira.door #pup{animation:none;transform:translate(-4px,-2px)}#mira.door #mhead{transform:rotate(-8deg) translateX(-6px)}#thr{fill:#a87a64}#mira.swallow #thr{animation:sw2 .7s 2}@keyframes sw2{40%{transform:translateY(5px)}}
#toast{position:absolute;left:50%;top:14%;transform:translate(-50%,-8px);opacity:0;padding:3px 12px;background:#000b;border:1px solid var(--amb);color:var(--amb);letter-spacing:.2em;font-size:clamp(8px,2.2vw,12px);white-space:nowrap;pointer-events:none}#toast.on{animation:ts 2.6s}@keyframes ts{10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.okl{stroke-dasharray:90;animation:dw 1s}@keyframes dw{from{stroke-dashoffset:90}}
#det.grab #dhand{animation:none;transform:translate(-34px,8px)}#det.place #dhand{animation:none;transform:translate(30px,6px)}#det.place{transform:translate(8px,6px)}
#det.exam{transform:translate(10px,8px) rotate(-3deg)}#det.board{transform:translate(-18px,-4px) rotate(-5deg)}
#det.tap #dhand{animation:tp .16s 8 alternate}@keyframes tp{to{transform:translateY(-5px)}}
#pad{transform-box:fill-box;transform-origin:left center}#det.turn #pad{animation:tn .6s 3}@keyframes tn{50%{transform:translate(8px,-6px) rotate(-14deg)}}
#det.react{animation:rc .5s}@keyframes rc{30%{transform:translate(0,-12px) scale(1.07)}60%{transform:translate(0,2px)}}
#mira{transition:transform .6s}#mira.lawy{transform:translateX(14px) scale(.97)}#mira.ltow{transform:translateX(-14px) scale(1.04)}
#mira.away #mhead{transform:rotate(9deg) translateX(10px)}#mira.away #pup{transform:translate(5px,1px)}
#mira.avoid #pup{transform:translate(-4px,4px)}#mira.avoid #mhead{transform:rotate(-5deg) translateY(3px)}
#mira.look #pup{transform:translate(-3px,5px)}#mira.look #mhead{transform:rotate(6deg) translateY(4px)}
#mira.tapf #mh{animation:tp .14s 10 alternate}#mira.shake #mh{animation:fd .07s 14 alternate}
#mira.pause #mbody,#mira.pause #mh{animation:none}#tear{fill:#bcd8f0;opacity:0}#mira.cry #tear{animation:dr 1.2s infinite}
#lt{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .5s}#frame.dark #lt{opacity:.5}
#xb{border-color:var(--red);color:var(--red)}#rt{margin:0 8px}

/* ===== motion pack ===== */
button{position:relative;overflow:hidden;transition:transform .15s,border-color .2s,box-shadow .25s}
button::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#ffffff22 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
button:not(:disabled):hover{border-color:var(--amb);box-shadow:0 0 14px #e0a84a44}button:not(:disabled):hover::after{transform:translateX(120%);transition:transform .6s}
button:not(:disabled):active{transform:scale(.96)}
#log p{animation:li .35s}@keyframes li{from{opacity:0;transform:translateX(-8px)}}
#menu{overflow:hidden}
#menu::before{content:'';position:absolute;left:-25%;right:-25%;top:-5%;bottom:-30%;z-index:-1;pointer-events:none;background:conic-gradient(from 166deg at 50% 0,transparent 0deg,#e0a84a22 11deg,#e0a84a44 14deg,#e0a84a22 17deg,transparent 28deg);transform-origin:50% 0;animation:lamp 6s ease-in-out infinite alternate,fk 7s infinite}
@keyframes lamp{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#menu.hold *{animation-play-state:paused}
#menu h1 span{display:inline-block;animation:ltr .7s calc(var(--i)*50ms + .15s) both}
@keyframes ltr{0%{opacity:0;transform:translateY(-14px) scaleY(1.6);filter:blur(6px)}60%{opacity:1;text-shadow:3px 0 #f0f,-3px 0 #0ff;transform:translateX(3px)}100%{opacity:1;transform:none;filter:none;text-shadow:0 0 18px #e0a84a55}}
#menu p,#menu button{animation:bi .6s both}#menu #msub{animation-delay:.9s}#menu button:nth-of-type(1){animation-delay:1.1s}#menu button:nth-of-type(2){animation-delay:1.2s}#menu button:nth-of-type(3){animation-delay:1.3s}#menu #note{animation-delay:1.4s}
@keyframes bi{from{opacity:0;transform:translateY(14px)}}
/* viewfinder lock-on */
#ret{position:absolute;inset:8%;pointer-events:none;opacity:0}#ret i{position:absolute;width:20px;height:20px;border:2px solid #e0a84acc}
#ret i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}#ret i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}#ret i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}#ret i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
#frame.rl #ret{animation:rt 1.3s ease-out}@keyframes rt{0%{opacity:0;inset:-4%}20%{opacity:1}100%{opacity:0;inset:8%}}
/* shockwave */
#ring{position:absolute;left:62%;top:38%;width:0;height:0;pointer-events:none}#ring i{position:absolute;left:-50px;top:-50px;width:100px;height:100px;border:2px solid var(--c,#e0a84a);border-radius:50%;opacity:0}
#ring.go i{animation:rg 1.2s cubic-bezier(.1,.7,.3,1)}#ring.go i:nth-child(2){animation-delay:.18s}@keyframes rg{from{transform:scale(.2);opacity:.9;border-width:4px}to{transform:scale(7);opacity:0;border-width:1px}}
/* stage lower-third */
#stg{position:absolute;left:0;top:42%;display:flex;gap:10px;padding:6px 18px 6px 10px;background:linear-gradient(90deg,#000e,#000b 75%,#0000);border-left:3px solid var(--amb);transform:translateX(-110%);pointer-events:none}
#stg.go{animation:sg 3.2s cubic-bezier(.2,.8,.2,1) both}@keyframes sg{0%{transform:translateX(-110%)}12%,80%{transform:none}100%{transform:translateX(-110%)}}
#stg .sb{display:flex;flex-direction:column;justify-content:center;color:var(--amb);font-size:clamp(6px,1.4vw,9px);letter-spacing:.2em;line-height:1;gap:2px}#stg b{font-size:clamp(20px,6vw,36px);line-height:1}
#sname{display:block;font-size:clamp(8px,2.2vw,13px);letter-spacing:.18em;margin-bottom:5px}#sseg i{display:inline-block;width:10px;height:4px;margin-right:3px;background:#333}
#sseg i.on{animation:sgo .3s var(--d) both}@keyframes sgo{to{background:var(--amb);box-shadow:0 0 6px var(--amb)}}
/* thinking */
#thk{position:absolute;left:51%;bottom:4%;display:flex;align-items:flex-end;gap:2px;opacity:0;transition:opacity .3s;color:var(--amb);font-size:clamp(6px,1.5vw,9px);letter-spacing:.12em;pointer-events:none}#thk.on{opacity:1}
#thk i{width:3px;height:10px;background:currentColor;transform-origin:bottom;animation:wv .9s ease-in-out infinite}#thk span{margin-left:6px}
#thk i:nth-child(2){animation-delay:.12s}#thk i:nth-child(3){animation-delay:.24s}#thk i:nth-child(4){animation-delay:.36s}#thk i:nth-child(5){animation-delay:.48s}@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
#banner::before{content:'';position:absolute;left:0;right:0;top:50%;height:2.6em;margin-top:-1.3em;z-index:-1;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:0;transform:scaleX(0)}
#banner.go::before{animation:bw 2.4s forwards}@keyframes bw{0%{transform:scaleX(0);opacity:.35}15%{transform:scaleX(1);opacity:.22}100%{transform:scaleX(1);opacity:0}}
/* boot / loading */
#boot{position:fixed;inset:0;z-index:60;display:block;overflow:hidden}
.bdl,.bdr{position:absolute;top:0;bottom:0;width:50.3%;background:radial-gradient(ellipse at 100% 50%,#1a1710,#07080b 70%);transition:transform .95s cubic-bezier(.75,0,.15,1)}

truth:"CANON. Ethan Reyes (31, investigative journalist) was investigating a financial fraud operation built on fake accounts and found documents linking Marcus Vale to it. He secretly copied them and planned to give them to another journalist. Marcus found out and arranged to meet Ethan at the abandoned office building, intending only to convince him to stop. Ethan said the evidence was already copied and someone else would receive it if anything happened to him. Marcus panicked, the talk became an argument, and Marcus attacked him, causing the injury that killed him around 12:07 AM (Ethan's watch broke). Marcus tried to make it look like a robbery or accident: took Ethan's phone, removed documents, deleted messages, and left. He failed to remove everything: a camera filmed him entering, a deleted message was partly recovered, and Ethan's recorder captured part of the argument. You do NOT know about the recording. Calm at first, then defensive; you may blame a robber or say evidence is misunderstood. Under pressure you first admit meeting Ethan but call it only an argument; you truly break when the recording is shown. Never invent or name an accomplice.",

env=(g,a,pk,d)=>{const t=T();g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(1e-4,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(1e-4,t+a+d)};
function init(){try{if(!X){X=new(window.AudioContext||window.webkitAudioContext)();M=G(mute?0:.9);const cp=X.createDynamicsCompressor();M.connect(cp);cp.connect(X.destination);
const L=X.sampleRate*2.6|0,ib=X.createBuffer(2,L,X.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.7)}
rv=X.createConvolver();rv.buffer=ib;const rg=G(.38);M.connect(rv);rv.connect(rg);rg.connect(cp);
nz=X.createBuffer(1,X.sampleRate*3,X.sampleRate);const d=nz.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
if(X.state=='suspended')X.resume()}catch(e){}}
const N=()=>{const s=X.createBufferSource();s.buffer=nz;s.loop=true;return s};
function thump(dl,v){const t=T()+dl,o=X.createOscillator(),g=G(1e-4);o.type='sine';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(38,t+.22);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(1e-4,t+.3);o.connect(g).connect(M);o.start(t);o.stop(t+.35)}
function thunder(){if(!A)return;const s=N(),f=X.createBiquadFilter(),g=G(1e-4),t=T();f.type='lowpass';f.frequency.setValueAtTime(260,t);f.frequency.exponentialRampToValueAtTime(60,t+3);g.gain.exponentialRampToValueAtTime(.55,t+.4);g.gain.exponentialRampToValueAtTime(1e-4,t+3.4);s.connect(f).connect(g).connect(M);s.start(t,Math.random()*2);s.stop(t+3.5)}
function ambient(){if(!X||A)return;const t=T(),out=G(1e-4);out.gain.exponentialRampToValueAtTime(1,t+2.5);out.connect(M);const nodes=[];
const lp=X.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;const lfo=X.createOscillator(),lg=G(110);lfo.frequency.value=.07;lfo.connect(lg).connect(lp.frequency);lfo.start();nodes.push(lfo);
[[55,'sawtooth',.05],[55.45,'sawtooth',.05],[27.5,'sine',.12],[82.4,'triangle',.035],[98,'triangle',.025]].forEach(([f,ty,v])=>{const o=X.createOscillator();o.type=ty;o.frequency.value=f;o.connect(G(v)).connect(lp);o.start();nodes.push(o)});lp.connect(out);
const r=N(),rb=X.createBiquadFilter(),rh=X.createBiquadFilter(),rgn=G(.055);rb.type='bandpass';rb.frequency.value=3800;rb.Q.value=.4;rh.type='highpass';rh.frequency.value=1500;r.connect(rb).connect(rh).connect(rgn).connect(out);r.start();nodes.push(r);
const rm=N(),rl=X.createBiquadFilter();rl.type='lowpass';rl.frequency.value=140;rm.connect(rl).connect(G(.22)).connect(out);rm.start();nodes.push(rm);
A={out,nodes};beat(1100);thT=setTimeout(function f(){thunder();thT=setTimeout(f,R(9000,16000))},R(4000,7000))}
function beat(ms){clearInterval(hbT);hbT=setInterval(()=>{if(!X||document.hidden)return;thump(0,.5);thump(.2,.32)},ms)}
function fade(s=2.4){if(!A)return;const a=A,t=T();clearInterval(hbT);clearTimeout(thT);a.out.gain.cancelScheduledValues(t);a.out.gain.setValueAtTime(a.out.gain.value,t);a.out.gain.exponentialRampToValueAtTime(1e-4,t+s);setTimeout(()=>a.nodes.forEach(n=>{try{n.stop()}catch(e){}}),s*1000+200);A=null}
function whoosh(d=.7,a=300,b=3200){if(!X)return;const s=N(),f=X.createBiquadFilter(),g=G(1e-4),t=T();f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(a,t);f.frequency.exponentialRampToValueAtTime(b,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d*.5);g.gain.exponentialRampToValueAtTime(1e-4,t+d);s.connect(f).connect(g).connect(M);s.start(t,Math.random()*2);s.stop(t+d+.1)}
function stamp(){if(!X)return;thump(0,1);const t=T(),s=N(),f=X.createBiquadFilter(),g=G(1e-4);f.type='bandpass';f.frequency.value=1800;g.gain.exponentialRampToValueAtTime(.5,t+.005);g.gain.exponentialRampToValueAtTime(1e-4,t+.09);s.connect(f).connect(g).connect(M);s.start(t);s.stop(t+.12);[[880,.05],[1320,.12]].forEach(([fr,dl])=>{const o=X.createOscillator(),k=G(1e-4);o.type='square';o.frequency.value=fr;k.gain.setValueAtTime(1e-4,t+dl);k.gain.exponentialRampToValueAtTime(.05,t+dl+.004);k.gain.exponentialRampToValueAtTime(1e-4,t+dl+.12);o.connect(k).connect(M);o.start(t+dl);o.stop(t+dl+.14)})}
function riser(d=3.2){if(!X)return;const t=T(),o=X.createOscillator(),f=X.createBiquadFilter(),g=G(1e-4);o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(520,t+d);f.type='lowpass';f.frequency.setValueAtTime(200,t);f.frequency.exponentialRampToValueAtTime(3000,t+d);g.gain.exponentialRampToValueAtTime(.09,t+d*.9);g.gain.exponentialRampToValueAtTime(1e-4,t+d+.15);o.connect(f).connect(g).connect(M);o.start(t);o.stop(t+d+.2);beat(620);setTimeout(()=>beat(1100),d*1000)}
function tick(){if(!X)return;const t=T(),o=X.createOscillator(),g=G(1e-4);o.type='sine';o.frequency.value=1250+Math.random()*300;g.gain.exponentialRampToValueAtTime(.06,t+.003);g.gain.exponentialRampToValueAtTime(1e-4,t+.05);o.connect(g).connect(M);o.start(t);o.stop(t+.06)}
function boom(){if(!X)return;thump(0,1);whoosh(.9,200,2400)}
function setMute(m){mute=m;try{localStorage.setItem('cfi.mute',m?'1':'0')}catch(e){}if(M)M.gain.setTargetAtTime(m?0:.9,T(),.05)}
document.addEventListener('visibilitychange',()=>{if(!X)return;document.hidden?X.suspend():X.resume()});
return{init,ambient,fade,stamp,whoosh,riser,tick,boom,setMute,get mute(){return mute}}})();
const pm=$('#pm');pm.textContent=SFX.mute?'SOUND OFF':'SOUND ON';pm.onclick=e=>{e.stopPropagation();SFX.init();SFX.setMute(!SFX.mute);pm.textContent=SFX.mute?'SOUND OFF':'SOUND ON';if(!SFX.mute)SFX.ambient()};
P.addEventListener('pointerdown',()=>{SFX.init();SFX.ambient()},{once:true});
/* loading screen sounds: watch the existing #boot element */
const B=document.getElementById('boot');let was='none',ok=0,op=0;
new MutationObserver(()=>{const d=getComputedStyle(B).display,c=B.className;if(d!='none'&&was=='none'){ok=op=0;SFX.riser(3)}was=d;if(/\bok\b/.test(c)&&!ok){ok=1;SFX.stamp()}if(/\bopen\b/.test(c)&&!op){op=1;SFX.boom();setTimeout(()=>SFX.fade(2.6),1400)}}).observe(B,{attributes:true,attributeFilter:['class','style']});
const BL=document.getElementById('blines');if(BL)new MutationObserver(()=>SFX.tick()).observe(BL,{childList:true});
/* play */
let went=0;const pb=$('#pb');pb.onclick=()=>{if(went)return;went=1;SFX.init();SFX.ambient();SFX.stamp();SFX.whoosh(.8,250,3500);pb.classList.add('hit');setTimeout(()=>P.classList.add('go'),420);setTimeout(()=>{window.__startBoot&&window.__startBoot()},520);setTimeout(()=>P.remove(),1800)};
})();
/* ===== AI case lock, validation, debug ===== */
(()=>{try{if(typeof CASES!='undefined'&&CASES[6]&&!CASES[6].tl)CASES[6].tl=['6:52 PM Elena texts Daniel "Come alone. I found the file."','7:16 PM Daniel arrives at 17 Blackwood Lane','7:28 PM Elena arrives and parks far away','7:34 PM Elena enters the house','7:41 PM Daniel says he already sent copies of the financial evidence','7:46 PM argument becomes heated','7:49 PM Daniel records audio','7:53 PM physical struggle begins','7:55 PM Elena strikes Daniel with a heavy object','7:58 PM Daniel smartwatch records a sharp heart-rate change','8:02 PM Elena stages the scene','8:08 PM Daniel condition worsens','8:11 PM false text sent from Daniel phone','8:14 PM Elena takes the USB drive','8:18 PM Elena leaves','8:23 PM security camera captures Elena leaving','8:29 PM Elena drives away'];}catch(e){}
const LOCK=()=>{const tl=(C.tl||[]).join(' ; ');return`\nTRUE TIMELINE (what really happened; you know it, but speak only per your COVER STORY until evidence breaks it): ${tl||'see HIDDEN TRUTH'}\nCASE LOCK: You are ${C.name}, the suspect about ${C.vic}. Facts come ONLY from HIDDEN TRUTH, COVER STORY, TRUE TIMELINE, evidence and your memory above. For any question about a time or place, compare it to the TRUE TIMELINE, then answer with the version in your COVER STORY (a lie, deflection, or "I don't remember" if the truth hurts you). NEVER invent a new location, person, witness, object, time, motive or relationship. If unsure say "I don't remember" or "I'm not answering that". Keep every earlier claim consistent; if the detective exposes a contradiction, respond to that contradiction instead of repeating yourself.\n`};
if(typeof window.__bp=='function'){const _bp=window.__bp;window.__bp=function(){let p=_bp.apply(this,arguments);try{p=p.includes('\nRULES:')?p.replace('\nRULES:',()=>LOCK()+'RULES:'):p+LOCK()}catch(e){}return p}}
if(typeof think=='function'){const _t=think;think=async function(q){const r=await _t.apply(this,arguments);try{if(r&&typeof r.line=='string'){if(/\b(as an ai|language model|i am an ai|i'm an ai|openai|groq)\b/i.test(r.line))return local(q);if(r.confess&&!(C.need(presented)&&presented.size>=C.auto))r.confess=false}}catch(e){}return r}}
if(/[?&]debug=1/.test(location.search)){const d=document.createElement('pre');d.style.cssText='position:fixed;left:6px;bottom:6px;z-index:99999;max-width:92vw;max-height:40vh;overflow:auto;margin:0;padding:8px;font:10px monospace;color:#7fffb0;background:#000c;border:1px solid #7fffb055;white-space:pre-wrap';document.body.append(d);setInterval(()=>{try{d.textContent=`DEBUG\nCASE ${C.n} | SUSPECT ${C.name}\nSTAGE ${ST[stage()]}\nLAST Q ${hist[hist.length-1]||'-'}\nCLAIMS ${claims.join(' | ')||'-'}\nTIMELINE ${(C.tl||[]).length} lines\nFOUND ${[...found]} PRESENTED ${[...presented]}\nAI CONTEXT LOADED`}catch(e){d.textContent='DEBUG (no case open)'}},800)}})();
</script>
